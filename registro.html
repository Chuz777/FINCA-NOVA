<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINCA NOVA | Registro</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body class="auth-page">
    <main class="page">
      <section class="auth-card" aria-label="Formulario de registro">
        <div class="auth-header">
          <div class="brand">
            <div class="brand-mark">☕</div>
            <span>FINCA NOVA</span>
          </div>
          <h1>Crear cuenta</h1>
          <p>Únete para gestionar tu finca y café Chaperno</p>
        </div>

        <div class="auth-body">
          <form>
            <div class="field">
              <label for="nombre">Nombre completo</label>
              <input id="nombre" type="text" placeholder="Juan Pérez" />
            </div>

            <div class="field full">
              <label for="email">Correo electrónico</label>
              <input id="email" type="email" placeholder="juancafe@finacanova.com" />
            </div>

            <div class="field">
              <label for="telefono">Teléfono</label>
              <input id="telefono" type="tel" placeholder="+504 0000-0000" />
            </div>

            <div class="field">
              <label for="password">Contraseña</label>
              <input id="password" type="password" placeholder="••••••••" />
            </div>

            <div class="field">
              <label for="confirm-password">Confirmar contraseña</label>
              <input id="confirm-password" type="password" placeholder="••••••••" />
            </div>

            <div class="field full">
              <button type="submit" class="btn btn-primary">Registrarme</button>
            </div>
          </form>

          <div class="auth-footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
