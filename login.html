<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINCA NOVA | Iniciar sesión</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body class="auth-page">
    <main class="page">
      <section class="auth-card" aria-label="Formulario de inicio de sesión">
        <div class="auth-header">
          <div class="brand">
            <div class="brand-mark">☕</div>
            <span>FINCA NOVA</span>
          </div>
          <h1>Iniciar sesión</h1>
          <p>Accede al control de Café Chaperno</p>
        </div>

        <div class="auth-body">
          <form>
            <div class="field">
              <label for="email">Correo electrónico</label>
              <input id="email" type="email" placeholder="ejemplo@finacanova.com" />
            </div>

            <div class="field">
              <label for="password">Contraseña</label>
              <input id="password" type="password" placeholder="••••••••" />
            </div>

            <div class="secondary-row">
              <label class="check">
                <input type="checkbox" />
                <span>Recordarme</span>
              </label>
              <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary">Entrar</button>
          </form>

          <div class="auth-footer">
            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
