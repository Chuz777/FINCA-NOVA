<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINCA NOVA | Recuperar contraseña</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body class="auth-page">
    <main class="page">
      <section class="auth-card" aria-label="Formulario de recuperación de contraseña">
        <div class="auth-header">
          <div class="brand">
            <div class="brand-mark">☕</div>
            <span>FINCA NOVA</span>
          </div>
          <h1>Recuperar contraseña</h1>
          <p>Te enviaremos instrucciones a tu correo</p>
        </div>

        <div class="auth-body">
          <form>
            <div class="field full">
              <label for="email">Correo electrónico</label>
              <input id="email" type="email" placeholder="ejemplo@finacanova.com" />
            </div>

            <div class="field full">
              <label for="password">Nueva contraseña</label>
              <input id="password" type="password" placeholder="••••••••" />
            </div>

            <div class="field full">
              <label for="confirm-password">Confirmar nueva contraseña</label>
              <input id="confirm-password" type="password" placeholder="••••••••" />
            </div>

            <div class="field full">
              <a href="login.html" class="btn btn-primary">Restablecer contraseña</a>
            </div>
          </form>

          <div class="auth-footer">
            <a href="login.html">Volver a iniciar sesión</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
